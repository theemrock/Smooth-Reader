name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Strip whitespace/CR picked up while pasting the secret; fail loudly if it is not valid base64.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SR_KEYSTORE_PASSWORD: ${{ secrets.SR_KEYSTORE_PASSWORD }}
          SR_KEY_ALIAS: ${{ secrets.SR_KEY_ALIAS }}
          SR_KEY_PASSWORD: ${{ secrets.SR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: smoothreader-release-apk
          path: app/build/outputs/apk/release/*.apk
